name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/free-skills-platform-h8us7l]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Turn Pages on for the repo if it is not enabled yet.
          enablement: true

      # The generator has no dependencies, so there is nothing to install.
      # base_path is "/fanin" for a project site, "" for a user or custom-domain site.
      - name: Build site
        run: node src/build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Check every page was written
        run: |
          pages=$(find dist -name 'index.html' | wc -l)
          echo "generated $pages pages"
          test "$pages" -ge 115

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
