name: Build and deploy

on:
  push:
    branches: [main, claude/free-skills-platform-h8us7l]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Always runs, and does not depend on Pages being configured. This is the
  # job that tells you whether the site is correct.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The generator has no dependencies, so there is nothing to install.
      - name: Build
        run: node src/build.mjs

      # Verifies every internal link resolves, every lesson has frontmatter,
      # every prereq points backwards and every seealso points forwards.
      - name: Check site integrity
        run: node src/check.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A workflow token cannot create the Pages site, so until Pages is
      # switched on for the repository the deploy has nothing to publish to.
      # That is a one-time setting, not a broken build — so this job skips
      # rather than failing, and the run stays green.
      - name: Is Pages enabled?
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The site built and passed all \
          integrity checks, but GitHub Pages is off for this repository (API \
          returned $code). Turn it on once at Settings -> Pages -> Build and \
          deployment -> Source: GitHub Actions. The next push will publish."
          fi

      - uses: actions/configure-pages@v5
        id: pages
        if: steps.status.outputs.enabled == 'true'

      # base_path is "/fanin" for a project site, "" for a user or custom-domain site.
      - name: Build with the resolved base path
        if: steps.status.outputs.enabled == 'true'
        run: node src/build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.status.outputs.enabled == 'true'
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.status.outputs.enabled == 'true'
